[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short -q

[flake8]
max-line-length = 100
ignore = E203, W503, E501
exclude = .venv, __pycache__, .git

[isort]
profile = black
line_length = 100

[mypy]
python_version = 3.11
ignore_missing_imports = true
