---
# ──────────────────────────────────────────────────────────────
# Namespace
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: churn-platform
  labels:
    app.kubernetes.io/name: churn-platform

---
# ──────────────────────────────────────────────────────────────
# ConfigMap
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: churn-api-config
  namespace: churn-platform
data:
  MODEL_PATH: "/app/artifacts/checkpoints/best_model.keras"
  SCALER_PATH: "/app/artifacts/pipeline/scaler.pkl"
  THRESHOLD: "0.5"
  LOG_LEVEL: "info"

---
# ──────────────────────────────────────────────────────────────
# Deployment — Inference API
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-api
  namespace: churn-platform
  labels:
    app: churn-api
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: churn-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: churn-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: churn-api
          image: churn-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: churn-api-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: model-artifacts
              mountPath: /app/artifacts
              readOnly: true
      volumes:
        - name: model-artifacts
          persistentVolumeClaim:
            claimName: model-artifacts-pvc

---
# ──────────────────────────────────────────────────────────────
# Service
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: churn-api-svc
  namespace: churn-platform
  labels:
    app: churn-api
spec:
  selector:
    app: churn-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP

---
# ──────────────────────────────────────────────────────────────
# HorizontalPodAutoscaler
# ──────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: churn-api-hpa
  namespace: churn-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: churn-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ──────────────────────────────────────────────────────────────
# Ingress
# ──────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: churn-api-ingress
  namespace: churn-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  rules:
    - host: churn-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: churn-api-svc
                port:
                  number: 80

---
# ──────────────────────────────────────────────────────────────
# PersistentVolumeClaim — model artefacts
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-artifacts-pvc
  namespace: churn-platform
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
